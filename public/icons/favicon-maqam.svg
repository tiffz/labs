<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Maqam Playground">
  <rect width="64" height="64" rx="14" fill="#1e2640" />
  <!--
    A half-flat: a flat sign with the bowl MIRRORED, stem on the right and the
    bowl opening to the left. The previous icon said "mirrored" in a comment
    and drew an ordinary flat, which is the one symbol this app exists to
    distinguish itself from.
  -->
  <g fill="none" stroke="#f3eac0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M41 13 V47" />
    <path d="M41 30 C31 24 23 29 25 36 C27 43 35 46 41 44" />
  </g>
</svg>
