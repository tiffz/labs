name: Nightly Portfolio Audit

# Cold-runner portfolio checks — not on PR CI (too slow).
# - Vitest fast suite + coverage (flake detector, no retries)
# - Playwright smoke + full visual matrix (Linux canonical baselines)
# - Lighthouse production audit (advisory — warnings only)
#
# Formerly "Nightly Flakiness Detector".

on:
  schedule:
    # 08:15 UTC = 01:15 PT / 04:15 ET — after main CI traffic tapers off.
    - cron: '15 8 * * *'
  workflow_dispatch:

jobs:
  vitest-cold:
    name: Vitest (cold cache + coverage)
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js (no npm cache)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Generate shared catalog
        run: npm run generate:shared-catalog

      - name: Check labs homepage catalog
        run: npm run check:labs-catalog

      - name: Run fast test suite (no retries)
        run: npm run test:fast -- --retry=0

      - name: Collect test coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          if-no-files-found: ignore
          path: |
            coverage/**

  playwright-cold:
    name: Playwright (smoke + visual)
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js (no npm cache)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (fresh)
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke
        run: npm run test:e2e:smoke

      # Each category runs even when an earlier one failed. The nightly exists to give a
      # portfolio-wide picture, and sequential fail-fast turned it into "the first thing that
      # broke": on 2026-08-21 a Muscle Memory soak timeout skipped the visual step entirely, so two
      # known-bad baselines went unreported for a day. The job still fails overall — it just no
      # longer hides the rest of the evidence while doing so.
      - name: Run soak specs (excluded from PR CI)
        if: '!cancelled()'
        run: npm run test:e2e:soak

      - name: Run visual regression baselines
        if: '!cancelled()'
        run: npm run test:e2e:visual

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-nightly-report
          if-no-files-found: ignore
          path: |
            playwright-report/**
            test-results/**

  lighthouse-portfolio:
    name: Lighthouse (production, per-app floors)
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js (no npm cache)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium

      - name: Production Lighthouse portfolio audit (per-app floors)
        id: lighthouse
        run: npm run audit:lighthouse -- --smoke-all --production --fail

      - name: Explain Lighthouse floor failures
        if: failure() && steps.lighthouse.outcome == 'failure'
        run: |
          echo "::error title=Lighthouse floors::One or more routes fell below their per-app floor (baseline − 5) — see docs/PERFORMANCE_BUDGETS.md and docs/LIGHTHOUSE_AUDIT.md"

      - name: Upload Lighthouse JSON reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-nightly-reports
          # `warn`, not `ignore`. The artifact has been absent from every recent nightly while this
          # step still reported success — `ignore` turns an empty glob into silence, so a breach was
          # never triageable. The reports ARE written locally (verified: .cache/lighthouse-_forms_.json,
          # 418 kB) and the script mkdirs recursively, so the cause is CI-specific and still unknown.
          # Warning makes the next run say so instead of hiding it.
          if-no-files-found: warn
          path: |
            .cache/lighthouse-*.json

  duplication-ratchet:
    name: jscpd clone-count ratchet (advisory)
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js (no npm cache)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Compare jscpd clone count against baseline (never fails)
        run: npm run check:jscpd-ratchet

  complexity-ratchet:
    name: complexity / function-length ratchet (advisory)
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js (no npm cache)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Compare complexity / long-function count against baseline (never fails)
        run: npm run check:complexity-ratchet

  # ---------------------------------------------------------------------------
  # Notification path. Without this, a scheduled workflow's only output is a log
  # nobody opens: this audit ran red for ten consecutive nights across three
  # unrelated causes and nothing said so. A solo repo has no reviewer to notice a
  # red square, so an advisory check that does not write something down is
  # indistinguishable from a deleted one (docs/CI_CHECK_VALUE.md § The solo rule).
  #
  # One deduplicated issue, opened on failure and closed on recovery, with the
  # per-job verdicts in the body so the three-strike rule has a history to read.
  # ---------------------------------------------------------------------------
  notify:
    name: Report nightly result
    runs-on: ubuntu-latest
    needs: [vitest-cold, playwright-cold, lighthouse-portfolio, duplication-ratchet, complexity-ratchet]
    if: always() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the nightly status issue
        uses: actions/github-script@v9
        env:
          RESULTS: |
            Vitest (cold cache + coverage): ${{ needs.vitest-cold.result }}
            Playwright (smoke + soak + visual): ${{ needs.playwright-cold.result }}
            Lighthouse (production floors): ${{ needs.lighthouse-portfolio.result }}
            jscpd duplication ratchet: ${{ needs.duplication-ratchet.result }}
            Complexity ratchet: ${{ needs.complexity-ratchet.result }}
        with:
          script: |
            const TITLE = 'Nightly Portfolio Audit is failing';
            const failed = Object.values(${{ toJSON(needs) }}).some((j) => j.result === 'failure');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'nightly-audit', per_page: 10,
            });
            const existing = open.find((i) => i.title === TITLE);

            if (!failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: existing.number,
                  body: `Nightly is green again as of ${runUrl}. Closing.`,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }

            const body = [
              `The nightly audit failed. Per-job results:`,
              '',
              '```',
              process.env.RESULTS.trim(),
              '```',
              '',
              `Run: ${runUrl}`,
              '',
              `Triage: \`npm run report:ci-failure -- ${context.runId}\`.`,
              `A failing **visual** step is a judging task, not a baseline refresh — see`,
              `\`.agents/skills/labs-visual-judge/SKILL.md\`.`,
              '',
              `**Three-strike rule** (docs/CI_CHECK_VALUE.md): red for three consecutive nights`,
              `means the offending job gets demoted to advisory and repaired on a deadline, or`,
              `deleted on purpose. Red and tolerated is the one state worse than either.`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: TITLE, body, labels: ['nightly-audit'],
              });
            }
