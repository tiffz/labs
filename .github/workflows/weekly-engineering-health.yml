name: Weekly engineering health

on:
  schedule:
    # Monday 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  ci-success-rate:
    name: CI success rate report (target >90%)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Report CI health (advisory gate)
        id: ci_health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-health-report.mjs --days 7 --fail-below 90

      # This used to emit only `::warning`, which meant the CI health monitor was warning into a
      # log during the same ten days the nightly audit sat red — the monitor and the thing it was
      # meant to catch failed silently together. Same pattern as the dependency-audit job below:
      # write it down, then fail visibly. docs/CI_CHECK_VALUE.md § The solo rule.
      - name: File a health issue when below target
        if: steps.ci_health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh issue create --label` fails outright when the label does not exist, and the REST
          # API's auto-create behaviour does not apply to the CLI. That is exactly how this step
          # shipped broken: the job went red as designed but filed nothing, because `ci-health` had
          # never been created. Make the label a precondition the workflow satisfies itself.
          gh label create ci-health --force \
            --color FBCA04 \
            --description "CI success rate below the 90% target (weekly gate)"
          existing=$(gh issue list --label ci-health --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "CI success rate below 90%" \
              --label ci-health \
              --body "$(printf 'The weekly gate measured CI success below the 90%% target.\n\nPer docs/ENGINEERING_HEALTH.md, flake triage is the first task of the next working session, before feature work:\n\n1. `npm run report:ci-health` to list failed run ids.\n2. `npm run report:ci-failure -- <run-id>` per failure; bucket each (e2e / vitest / build / infra).\n3. Fix the top recurring bucket at root cause per docs/FLAKY_TESTS.md — no retries, no quarantine-and-forget.\n\nRun: %s/%s/actions/runs/%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          else
            echo "Open ci-health issue already exists; skipping duplicate."
          fi

      - name: Fail the job so the advisory is visible
        if: steps.ci_health.outcome == 'failure'
        run: |
          echo "::error title=CI success rate below 90%::See the filed ci-health issue. Triage with npm run report:ci-health and docs/ENGINEERING_HEALTH.md."
          exit 1

  dependency-audit:
    name: npm audit (security fast lane)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: |
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit-output.txt

      - name: File security issue on high/critical advisories
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same precondition as the ci-health job above — the label must exist before --label works.
          gh label create security-audit --force \
            --color D93F0B \
            --description "High/critical npm advisories in production dependencies"
          existing=$(gh issue list --label security-audit --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "npm audit: high/critical advisories in production deps" \
              --label security-audit \
              --body "$(printf 'Weekly security fast lane found high/critical advisories.\n\nTriage: `npm audit --omit=dev` locally, patch in-range with `npm audit fix`, majors via docs/DEPENDENCY_UPGRADE_PLAN.md.\n\n```\n%s\n```' "$(tail -c 4000 audit-output.txt)")"
          else
            echo "Open security-audit issue already exists; skipping duplicate."
          fi

      - name: Fail the job so the advisory is visible
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error title=npm audit found high/critical advisories::See the filed security-audit issue. Patch via npm audit fix or docs/DEPENDENCY_UPGRADE_PLAN.md."
          exit 1

  nightly-smoke:
    name: Nightly smoke (cold browser)
    runs-on: ubuntu-latest
    needs: ci-success-rate
    if: github.event_name == 'workflow_dispatch'
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
