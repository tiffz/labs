name: CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.json'
      - '**.css'
      - '**.md'
      - '**.html'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - 'public/**'
      - 'package*.json'
      - '.github/workflows/**'
      - 'vite.config.*'
      - 'vitest.config.*'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'knip.config.*'
      - 'playwright.config.*'
      - 'workers/**'
      - 'CNAME'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.json'
      - '**.css'
      - '**.md'
      - '**.html'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - 'public/**'
      - 'package*.json'
      - '.github/workflows/**'
      - 'vite.config.*'
      - 'vitest.config.*'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'knip.config.*'
      - 'playwright.config.*'
      - 'workers/**'
      - 'CNAME'
      - 'LICENSE'

# Cancel superseded runs on the same branch (saves CI minutes; check latest run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  # Detect diff scope once; downstream jobs consume outputs.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      beat_changed: ${{ steps.beat-changes.outputs.beat_changed }}
      e2e_mode: ${{ steps.e2e-scope.outputs.mode }}
      vitest_mode: ${{ steps.vitest-scope.outputs.mode }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Need history to detect file changes

    - name: Check for shared tempo analysis file changes
      id: beat-changes
      run: |
        # For PRs, compare against base branch; for pushes, compare against previous commit
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_REF="origin/${{ github.base_ref }}"
        else
          BASE_REF="${{ github.event.before }}"
        fi

        if git diff --name-only "$BASE_REF" HEAD 2>/dev/null | grep -q '^src/shared/beat/'; then
          echo "beat_changed=true" >> $GITHUB_OUTPUT
          echo "Shared tempo analysis files changed - will run full benchmarks"
        else
          echo "beat_changed=false" >> $GITHUB_OUTPUT
          echo "No shared tempo analysis file changes - will skip benchmarks"
        fi

    - name: Detect e2e smoke scope
      id: e2e-scope
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_REF="origin/${{ github.base_ref }}"
        else
          BASE_REF="${{ github.event.before }}"
        fi
        CHANGED="$(git diff --name-only "$BASE_REF" HEAD 2>/dev/null || true)"
        # src/types/ holds shared type defs — treat as cross-cutting, not an app.
        if echo "$CHANGED" | grep -qE '^(src/shared/|src/types/|e2e/|vite\.config|playwright\.config|package|\.github/workflows/)'; then
          echo "mode=full" >> $GITHUB_OUTPUT
          echo "Cross-cutting changes — full e2e smoke"
        elif [ -z "$CHANGED" ]; then
          echo "mode=full" >> $GITHUB_OUTPUT
          echo "No diff — full e2e smoke"
        else
          APP_COUNT="$(echo "$CHANGED" | grep -E '^src/[^/]+/' | cut -d/ -f2 | sort -u | wc -l | tr -d ' ')"
          if [ "$APP_COUNT" -le 3 ] && [ "$APP_COUNT" -gt 0 ]; then
            echo "mode=scoped" >> $GITHUB_OUTPUT
            echo "Single-app diff — scoped e2e via run-scoped-e2e.mjs"
          else
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "Multi-app or non-app diff — full e2e smoke"
          fi
        fi

    - name: Detect vitest scope
      id: vitest-scope
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_REF="origin/${{ github.base_ref }}"
        else
          BASE_REF="${{ github.event.before }}"
        fi
        CHANGED="$(git diff --name-only "$BASE_REF" HEAD 2>/dev/null || true)"
        if echo "$CHANGED" | grep -qE '^(src/shared/|src/types/|vite\.config|vitest\.config|package|\.github/workflows/)'; then
          echo "mode=full" >> $GITHUB_OUTPUT
          echo "Cross-cutting changes — full Vitest"
        elif [ -z "$CHANGED" ]; then
          echo "mode=full" >> $GITHUB_OUTPUT
          echo "No diff — full Vitest"
        else
          APP_COUNT="$(echo "$CHANGED" | grep -E '^src/[^/]+/' | cut -d/ -f2 | sort -u | wc -l | tr -d ' ')"
          if [ "$APP_COUNT" -le 3 ] && [ "$APP_COUNT" -gt 0 ]; then
            echo "mode=scoped" >> $GITHUB_OUTPUT
            echo "Narrow app diff — scoped Vitest via run-changed-app-tests.mjs"
          else
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "Multi-app or non-app diff — full Vitest"
          fi
        fi

  # Static gates: guardrail contracts, lint, typecheck, knip.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      HUSKY: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup project (Node + cached deps)
      uses: ./.github/actions/setup-project

    # Persist the ESLint cache for `npm run lint` across runs (see react-hooks job).
    - name: Cache ESLint (lint) results
      uses: actions/cache@v6
      with:
        path: .cache/eslint
        key: eslint-lint-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          eslint-lint-${{ runner.os }}-

    - name: Enforce shared-layer import boundaries
      run: npm run check:import-boundaries

    - name: Validate agent docs and skills
      run: npm run check:agent-docs

    - name: Doc link hygiene
      run: npm run check:doc-links

    - name: UI copy baseline
      run: npm run check:ui-copy

    - name: CSS important baseline
      run: npm run check:css-important

    - name: CSS import order
      run: npm run check:css-import-order

    - name: Workflow guardrails (single Pages deploy)
      run: npm run check:workflows

    - name: Knip ignore config comments
      run: npm run check:knip-config

    - name: Unused-exports ratchet
      run: npm run check:knip-exports-ratchet

    - name: Registry drift (build inputs ↔ route registry)
      run: npm run check:registry-drift

    - name: Shared theme contract
      run: npm run check:shared-theme-contract

    # Must run BEFORE the generate step below: it asserts the *committed* catalog matches its
    # sources, and regenerating first would make it pass unconditionally. Both this and the theme
    # contract ran only in presubmit until now, so skipping presubmit bypassed them outright.
    - name: Shared catalog is current (committed vs sources)
      run: npm run check:shared-catalog

    - name: Generate shared catalog
      run: npm run generate:shared-catalog

    - name: Check labs homepage catalog
      run: npm run check:labs-catalog

    - name: Check .cursor/ and .claude/ guidance is in sync with .agents/
      run: npm run check:agent-guidance

    - name: Chrome UI contract
      run: npm run check:chrome-ui

    - name: Menu a11y contract
      run: npm run check:menu-a11y

    - name: Volume slider contract
      run: npm run check:volume-slider

    - name: App quality contract
      run: npm run check:app-quality

    - name: Muscle public assets
      run: npm run muscle:validate-assets

    - name: Run linter
      run: npm run lint

    # Full config (tsconfig.json), not tsconfig.app.json. The app config excludes *.test.ts,
    # *.spec.*, e2e/** and audits/**, so an app-only typecheck cannot fail on a type error in a
    # test file — and this job was the only typecheck CI ran. Five such errors reached a push
    # before this was noticed. The full config is strictly stronger: every difference in
    # tsconfig.app.json (relaxed noUnusedLocals/Parameters, wider lib, extra types) makes it more
    # permissive, so full passing implies app passing.
    - name: Run full typecheck (includes tests and e2e)
      run: npm run typecheck:full

    - name: Check for dead code
      run: npm run knip

  # CI-only: the 14 React Compiler react-hooks rules take >3 min across `src`,
  # too slow for presubmit. Its own job keeps `checks` fast and parallel.
  # docs/TECH_DEBT_ROADMAP.md § 2026-07 Wave 1.
  react-hooks-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      HUSKY: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup project (Node + cached deps)
      uses: ./.github/actions/setup-project

    # Persist the ESLint cache across runs (rolling key: fresh each commit, restored
    # from the most recent prefix match). The React Compiler rules are the slow part;
    # with the cache, an incremental PR only re-analyzes the files it changed.
    - name: Cache ESLint (react-hooks) results
      uses: actions/cache@v6
      with:
        path: .cache/eslint
        key: eslint-react-hooks-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          eslint-react-hooks-${{ runner.os }}-

    - name: React-hooks (React Compiler) ratchet
      run: npm run check:react-hooks-ratchet

  vitest:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      HUSKY: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Scoped Vitest diffs against merge base

    - name: Setup project (Node + cached deps)
      uses: ./.github/actions/setup-project

    - name: Run tests (full)
      if: needs.scope.outputs.vitest_mode == 'full'
      env:
        INCLUDE_BEAT_BENCHMARK: ${{ needs.scope.outputs.beat_changed }}
      # One retry in CI absorbs rare Vitest worker teardown flakes (BroadcastChannel).
      run: npm test -- --retry=1

    - name: Run tests (scoped)
      if: needs.scope.outputs.vitest_mode == 'scoped'
      env:
        INCLUDE_BEAT_BENCHMARK: ${{ needs.scope.outputs.beat_changed }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          node scripts/run-changed-app-tests.mjs "origin/${{ github.base_ref }}" -- --retry=1
        else
          node scripts/run-changed-app-tests.mjs "${{ github.event.before }}" -- --retry=1
        fi

    - name: Upload audio regression report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: audio-regression-report
        if-no-files-found: ignore
        path: |
          src/shared/beat/regression/reports/**

  # Coverage runs nightly (nightly-portfolio-audit.yml) — not on every PR/main push.

  e2e:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      HUSKY: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Scoped e2e diffs against merge base

    - name: Setup project (Node + cached deps)
      uses: ./.github/actions/setup-project

    - name: Resolve Playwright version
      id: playwright-version
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run e2e smoke tests (full)
      if: needs.scope.outputs.e2e_mode == 'full'
      run: npm run test:e2e:smoke

    - name: Run e2e smoke tests (scoped)
      if: needs.scope.outputs.e2e_mode == 'scoped'
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          node scripts/run-scoped-e2e.mjs "origin/${{ github.base_ref }}"
        else
          node scripts/run-scoped-e2e.mjs "${{ github.event.before }}"
        fi

    - name: Run playback UI regression smokes
      if: needs.scope.outputs.e2e_mode == 'full'
      run: npx playwright test e2e/playback-ui-regressions.spec.ts

    # Audio regression hashes are already covered by Vitest
    # (src/shared/beat/regression/syntheticAudioGenerator.audio-regression.test.ts); no
    # separate re-run needed here.

    - name: Run visual regression screenshots (scoped, blocking)
      # Scoped diffs get BLOCKING visual regression for the changed apps' routes.
      # Unexpected diffs must be judged per docs/VISUAL_JUDGE_RUBRIC.md (skill
      # labs-visual-judge) — fix must-fix regressions, or import intentional
      # baselines from this run's artifacts before merge.
      if: needs.scope.outputs.e2e_mode == 'scoped'
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          npx tsx scripts/run-scoped-visual.mts "origin/${{ github.base_ref }}"
        else
          npx tsx scripts/run-scoped-visual.mts "${{ github.event.before }}"
        fi

    - name: Run visual regression screenshots (full matrix, blocking)
      # Broad diffs (src/shared/**, tooling, config) previously got NO visual coverage at PR time:
      # the scoped step above only runs when e2e_mode == 'scoped', so the riskiest changes for
      # appearance — shared CSS and design tokens, which every app inherits — were the one category
      # with nothing checking them until the nightly ran hours later.
      #
      # That is how #163 landed a deliberate drums toolbar restyle without refreshing its baseline:
      # it touched src/shared/components/music/appSharedThemes.css, so the diff class was 'full',
      # the scoped visual step was skipped, CI was green, and the nightly went red that evening.
      #
      # The full matrix is 66 screenshots in ~2.8 min on CI, which is worth paying on the minority
      # of PRs that are broad. Judge unexpected diffs per docs/VISUAL_JUDGE_RUBRIC.md.
      if: needs.scope.outputs.e2e_mode == 'full'
      run: npm run test:e2e:visual

    - name: Upload visual regression artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: visual-regression-artifacts
        if-no-files-found: ignore
        path: |
          playwright-report/**
          test-results/**

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      HUSKY: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup project (Node + cached deps)
      uses: ./.github/actions/setup-project

    - name: Build project
      env:
        VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
        VITE_LABS_DRIVE_TESTER_HASHES: ${{ secrets.VITE_LABS_DRIVE_TESTER_HASHES }}
        # Turns on the session BFF (ADR 0014) so Google access tokens refresh server-side
        # instead of expiring roughly hourly with no way back. The worker has been deployed and
        # healthy since 2026-07-25; this build var is the only thing that was never set, so the
        # whole BFF was dead code in production.
        #
        # Override with a repo secret of the same name; set that secret to an empty string (or
        # delete this line) to fall back to GIS-only sign-in. Every technical BFF failure is
        # already treated as recoverable and falls through to GIS, so the worst case here is
        # today's behaviour, not a broken sign-in.
        #
        # KNOWN LIMIT: on *.workers.dev the session cookie is cross-site to labs.tiffzhang.com, so
        # browsers blocking third-party cookies may drop it — sign-in appears to work, then the
        # next refresh says "not signed in". The durable fix is a same-site custom domain
        # (session.tiffzhang.com), which needs the DNS zone moved to Cloudflare first; see
        # workers/labs-session-bff/README.md § First-party host.
        VITE_LABS_SESSION_BFF_URL: ${{ secrets.VITE_LABS_SESSION_BFF_URL || 'https://labs-session-bff.tiffz.workers.dev' }}
        VITE_APP_ENV: production
      run: npm run build

    - name: Bundle size gate (two-tier vs docs/bundle-size-baseline.json)
      run: node scripts/bundle-size-report.mjs --skip-build --check

    - name: Upload production build artifact
      uses: actions/upload-artifact@v7
      with:
        name: production-dist
        path: dist/
        retention-days: 1

  deploy:
    # MUST equal the branch-protection required status checks (checks, vitest, e2e, build).
    # The deploy ships exactly what the merge gate approved — if a job gates the deploy but
    # not the merge, a PR merges green and the deploy silently skips (see #120/#121).
    # `react-hooks-ratchet` is an advisory debt ratchet (visible on the PR, not a ship gate),
    # so it is deliberately NOT here. Guarded by scripts/check-ci-gating.mjs.
    needs: [checks, vitest, e2e, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment_retry2.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Download production build artifact
      uses: actions/download-artifact@v8
      with:
        name: production-dist
        path: dist

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      timeout-minutes: 10
      continue-on-error: true

    - name: Wait before Pages deploy retry (90s)
      if: steps.deployment.outcome == 'failure'
      run: sleep 90

    - name: Deploy to GitHub Pages (retry 1)
      id: deployment_retry
      if: steps.deployment.outcome == 'failure'
      uses: actions/deploy-pages@v5
      timeout-minutes: 10
      continue-on-error: true

    - name: Wait before Pages deploy retry (120s)
      if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
      run: sleep 120

    - name: Deploy to GitHub Pages (retry 2)
      id: deployment_retry2
      if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
      uses: actions/deploy-pages@v5
      timeout-minutes: 10

    - name: Require successful Pages deploy
      if: always()
      run: |
        if [ "${{ steps.deployment.outcome }}" = "success" ]; then exit 0; fi
        if [ "${{ steps.deployment_retry.outcome }}" = "success" ]; then exit 0; fi
        if [ "${{ steps.deployment_retry2.outcome }}" = "success" ]; then exit 0; fi
        echo "Pages deploy failed after retries"
        exit 1
