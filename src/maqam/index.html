<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      color-scheme and theme-color control the browser chrome (status bar,
      form control defaults) before CSS loads. Match this app's dominant
      background ("light" or "dark") and its primary brand color.
    -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1d4e6f" />

    <!--
      Critical CSS. Paints the html background during HTML parse so that the
      user never sees a flash of unstyled content (FOUC) before the app's
      theme stylesheet loads. Keep this string tiny - two declarations only.
      The background MUST match the app's resting body background.
    -->
    <style>html{color-scheme:light;background:#fbf7f0;color:#241d16}</style>

    <!--
      HTML shell cache-busting. Combined with the build-version.txt reload
      hook, this keeps users from being stuck on a stale SPA shell after a
      deploy. DO NOT add a manifest or service worker here; labs deliberately
      opts out of PWA install prompts (see vite.config.ts). Use a single
      Cache-Control meta only (see spaGuardrails + .cursor/rules/app-entry-html).
    -->
    <meta http-equiv="Cache-Control" content="no-cache" />

    <title>Maqam Playground - Tiff Zhang Labs</title>
    <meta name="description" content="Retune a piano keyboard to Arabic maqamat and hear the quarter-tones between the keys." />
    <link rel="canonical" href="https://labs.tiffzhang.com/maqam/" />

    <!-- Social share metadata. -->
    <meta property="og:title" content="Maqam Playground - Tiff Zhang Labs" />
    <meta property="og:description" content="Retune a piano keyboard to Arabic maqamat and hear the quarter-tones between the keys." />
    <meta property="og:url" content="https://labs.tiffzhang.com/maqam/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tiff Zhang Labs" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Maqam Playground - Tiff Zhang Labs" />
    <meta name="twitter:description" content="Retune a piano keyboard to Arabic maqamat and hear the quarter-tones between the keys." />

    <!-- Favicons. Every app ships a per-app SVG + Apple touch icon. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-maqam.svg" />
    <link rel="apple-touch-icon" href="/icons/favicon-maqam.svg" />

    <!--
      Shared CSS baseline (box-sizing reset, skip-link styles, reduced-motion
      override). Required for every app so that <SkipToMain /> and the global
      a11y baseline work.
    -->
    <link rel="stylesheet" href="/styles/shared.css" />

    <!--
      Webfonts are self-hosted via @fontsource (see src/shared/ui/fonts/) and
      pulled in from main.tsx, never linked from a third-party stylesheet host.
    -->
    <!--
      Cookie / analytics consent (GA4) + theming. Keep this trio together:
      1) labs-cookie-consent.css — layout and tokens (--labs-cc-*).
      2) Tiny :root style — set --labs-cc-accent (and --labs-cc-on-accent if needed)
         to match meta theme-color / your brand. Defaults are in the CSS file.
      3) labs-cookie-consent.js — built from src/shared/legal (npm run build:labs-cookie-consent); defer;
         localhost skips banner + analytics. Preview banner: ?labs_preview_cookie_banner=1
    -->
    <link rel="stylesheet" href="/styles/labs-cookie-consent.css" />
    <style>:root { --labs-cc-accent: #1d4e6f; --labs-cc-on-accent: #ffffff; }</style>
    <script defer src="/scripts/labs-cookie-consent.js"></script>
  </head>
  <body>
    <noscript>
      <p style="padding:24px;font-family:system-ui,sans-serif">
        This app needs JavaScript to run. Please enable JavaScript in your browser.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/maqam/main.tsx"></script>
    <!--
      Layout shell: copy app-main.starter.tsx + app-layout.starter.css from
      src/shared/templates/ when the app has header + scroll + optional footer.
      See src/shared/layout/README.md
    -->
  </body>
</html>
